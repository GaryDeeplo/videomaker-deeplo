<!-- deeplo-library-block: accroche-encre · encre de Chine : grand coup de pinceau qui se trace, titre qui se dépose, sceau rouge -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="accroche-encre" data-composition-id="accroche-encre" data-start="0" data-duration="3.0" data-width="1080" data-height="1920"
      data-composition-variables='[{"id": "text", "type": "string", "label": "Titre (2 à 6 mots)", "default": "Votre titre ici"}, {"id": "sub", "type": "string", "label": "Petite ligne", "default": ""}, {"id": "accent", "type": "color", "label": "Accent", "default": "#c1121f"}, {"id": "bg", "type": "color", "label": "Fond", "default": "#f4efe4"}, {"id": "ink", "type": "color", "label": "Encre", "default": "#111111"}, {"id": "font", "type": "string", "label": "Police", "default": "Inter"}, {"id": "dur", "type": "number", "label": "Durée (s, remplie automatiquement)", "default": 0, "min": 0, "max": 10}]'>
      <div class="hk">
        <svg class="brush" viewBox="0 0 1000 400" preserveAspectRatio="none"><defs><filter id="rough" filterUnits="userSpaceOnUse" x="-100" y="-300" width="1200" height="1000"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" />
          <feDisplacementMap in="SourceGraphic" scale="22" /></filter></defs>
          <path d="M 60 215 C 300 175, 650 245, 940 190" pathLength="1000" /></svg><i class="seal"></i>
        <div class="hk-box"><div class="hk-t"></div><div class="hk-s" data-var-text="sub"></div></div>
      </div>
      <style>
        #accroche-encre { position: absolute; inset: 0; font-family: var(--font, "Inter"), "Inter", sans-serif; }
        #accroche-encre .hk { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
        #accroche-encre .hk-box { position: absolute; left: 7vmin; right: 7vmin; top: 50%; transform: translateY(-50%); text-align: center; z-index: 5; }
        #accroche-encre .hk-t { font-weight: 900; line-height: 1.02; letter-spacing: -0.02em; }
        #accroche-encre .hk-t .wd { display: inline-block; white-space: nowrap; }
        #accroche-encre .hk-t .ch { display: inline-block; }
        #accroche-encre .hk-s { margin-top: 3vmin; font-size: 4.4vmin; font-weight: 600; opacity: 0; }
        #accroche-encre .brush { position: absolute; left: 0; width: 100%; top: 54%; height: 18%; overflow: visible; }
        #accroche-encre .brush path { fill: none; stroke: var(--ink); stroke-width: 70; stroke-linecap: round; filter: url(#rough); stroke-dasharray: 1000; opacity: .9; }
        #accroche-encre .seal { position: absolute; right: 12vmin; bottom: 22%; width: 13vmin; height: 13vmin; background: var(--accent); border-radius: 1.2vmin;
                box-shadow: inset 0 0 0 1vmin color-mix(in srgb, var(--accent) 70%, #fff); opacity: 0; }
        #accroche-encre .hk-box { top: 44%; } #accroche-encre .hk-t { color: var(--ink); }
        #accroche-encre .hk-s { color: var(--ink); margin-top: 14vmin; letter-spacing: .3em; }
      </style>
      <script>
        (function () {
        function V(id) {
          var out = {}, root = document.getElementById(id);
          try { JSON.parse(root.getAttribute("data-composition-variables")).forEach(function (d) { out[d.id] = d.default; }); } catch (e) {}
          var hf = window.__hyperframes;
          var o = hf && typeof hf.getVariables === "function" ? hf.getVariables() : window.__hfVariables;
          if (o && typeof o === "object") { for (var k in o) { if (o[k] !== undefined) out[k] = o[k]; } }
          return out;
        }
        const v = V("accroche-encre");
        const r = '[data-composition-id="accroche-encre"] ';
        const tl = gsap.timeline({ paused: true });
        const D = Number(v.dur) > 0 ? Number(v.dur) : 3.0;
        const T = String(v.text || ""), host = document.querySelector(r + ".hk-t");
        T.split(" ").forEach(function (w, wi) {
          const ws = document.createElement("span"); ws.className = "wd";
          Array.from(w).forEach(function (c) { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; ws.appendChild(s); });
          host.appendChild(ws); if (wi < T.split(" ").length - 1) host.appendChild(document.createTextNode(" "));
        });
        host.style.fontSize = Math.max(8.5, Math.min(15, 150 / Math.max(6, T.length * 0.95))) + "vmin";
        const CH = document.querySelectorAll(r + ".ch");
        const EXIT = Math.max(1.2, D - 0.45);
        tl.fromTo(r + ".brush path", { attr: { "stroke-dashoffset": 1000 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.8, ease: "power2.inOut" }, 0.05);
        tl.fromTo(CH, { opacity: 0, filter: "blur(1.5vmin)" }, { opacity: 1, filter: "blur(0vmin)", duration: 0.5, stagger: 0.03, ease: "power2.out" }, 0.55);
        tl.fromTo(r + ".seal", { opacity: 0, scale: 2.2, rotation: -20 }, { opacity: 1, scale: 1, rotation: -6, duration: 0.3, ease: "back.out(2)" }, 1.3);
        tl.fromTo(r + ".hk-s", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, Math.min(1.2, D * 0.4));
        tl.fromTo(r + ".hk", { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 100% 0%)", duration: 0.42, ease: "power3.in" }, EXIT);
        window.__timelines = window.__timelines || {};
        window.__timelines["accroche-encre"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
