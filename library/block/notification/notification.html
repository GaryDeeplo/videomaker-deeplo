<!-- deeplo-library-block: notification · bannière de notification façon smartphone qui descend, rebondit, puis remonte -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="notification" data-composition-id="notification" data-start="0" data-duration="3.2" data-width="1080" data-height="1920"
      data-composition-variables='[{"id": "accent", "type": "color", "label": "Accent", "default": "#c2410c"}, {"id": "text", "type": "color", "label": "Texte", "default": "#ffffff"}, {"id": "card", "type": "color", "label": "Fond de carte", "default": "rgba(20,18,16,0.78)"}, {"id": "fill", "type": "color", "label": "Fond plein cadre (transparent en surimpression)", "default": "transparent"}, {"id": "font", "type": "string", "label": "Police", "default": "Inter"}, {"id": "top", "type": "number", "label": "Hauteur (% du cadre)", "default": 40, "min": 0, "max": 90}, {"id": "dur", "type": "number", "label": "Durée du montage (s, remplie automatiquement)", "default": 0, "min": 0, "max": 60}, {"id": "icon", "type": "string", "label": "Icône (chemin assets/…)", "default": "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="}, {"id": "app", "type": "string", "label": "Nom de l&#39;app / marque", "default": "Votre boutique"}, {"id": "title", "type": "string", "label": "Titre", "default": "Nouvelle commande !"}, {"id": "message", "type": "string", "label": "Message", "default": "Julie vient de réserver sa démonstration"}, {"id": "when", "type": "string", "label": "Moment", "default": "maintenant"}]'>
      <div class="mf-fill"></div>
      <div class="mf-pos"><div class="nt-card">
        <img class="nt-icon" data-var-src="icon" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="" />
        <div class="nt-txt"><div class="nt-head"><span class="nt-app" data-var-text="app">Votre boutique</span><span class="nt-when" data-var-text="when">maintenant</span></div>
        <div class="nt-title" data-var-text="title">Nouvelle commande !</div><div class="nt-msg" data-var-text="message">…</div></div></div></div>
      <style>
        #notification { position: absolute; inset: 0; font-family: var(--font, "Inter"), "Inter", sans-serif; color: var(--text, #fff); }
        #notification .mf-fill { position: absolute; inset: 0; background: var(--fill, transparent); }
        #notification .mf-pos { position: absolute; left: 0; right: 0; top: calc(var(--top, 40) * 1%); display: flex; justify-content: center; }
        #notification .nt-card { width: 86%; display: flex; gap: 3vmin; align-items: flex-start; padding: 3vmin 3.4vmin; border-radius: 4vmin;
                                  background: rgba(245,245,247,.92); color: #111; box-shadow: 0 2vmin 6vmin rgba(0,0,0,.3); opacity: 0;
                                  backdrop-filter: blur(20px); }
        #notification .nt-icon { width: 11vmin; height: 11vmin; border-radius: 2.6vmin; object-fit: contain; background: #fff; flex: none; }
        #notification .nt-txt { flex: 1; min-width: 0; }
        #notification .nt-head { display: flex; justify-content: space-between; font-size: 3.3vmin; color: #6b6b70; text-transform: uppercase; letter-spacing: .04em; }
        #notification .nt-title { font-size: 4.6vmin; font-weight: 700; margin-top: .6vmin; }
        #notification .nt-msg { font-size: 4.1vmin; line-height: 1.25; color: #333; }
      </style>
      <script>
        (function () {
        function V(id) {
          var out = {}, root = document.getElementById(id);
          try { JSON.parse(root.getAttribute("data-composition-variables")).forEach(function (d) { out[d.id] = d.default; }); } catch (e) {}
          var hf = window.__hyperframes;
          var o = hf && typeof hf.getVariables === "function" ? hf.getVariables() : window.__hfVariables;
          if (o && typeof o === "object") { for (var k in o) { if (o[k] !== undefined) out[k] = o[k]; } }
          return out;
        }
        const v = V("notification");
        const r = '[data-composition-id="notification"] ';
        const tl = gsap.timeline({ paused: true });
        const D = Number(v.dur) > 0 ? Number(v.dur) : 3.2;
        const K = Math.min(1, D / 3.2);  // tout se resserre si le bloc est monté plus court que prévu
        tl.fromTo(r + ".nt-card", { opacity: 0, y: -260, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.65, ease: "back.out(1.6)" }, 0);
        tl.to(r + ".nt-card", { x: 10, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, 0.7);
        tl.to(r + ".nt-card", { opacity: 0, y: -260, duration: 0.45, ease: "power3.in" }, D - 0.5);
        window.__timelines = window.__timelines || {};
        window.__timelines["notification"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
