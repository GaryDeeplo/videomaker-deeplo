<!-- deeplo-library-block: accroche-papier · papier découpé : couches de papier qui montent, lettres en papier qui se posent -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="accroche-papier" data-composition-id="accroche-papier" data-start="0" data-duration="3.0" data-width="1080" data-height="1920"
      data-composition-variables='[{"id": "text", "type": "string", "label": "Titre (2 à 6 mots)", "default": "Votre titre ici"}, {"id": "sub", "type": "string", "label": "Petite ligne", "default": ""}, {"id": "accent", "type": "color", "label": "Accent", "default": "#e4572e"}, {"id": "bg", "type": "color", "label": "Fond", "default": "#f3ead8"}, {"id": "ink", "type": "color", "label": "Encre", "default": "#2b2118"}, {"id": "font", "type": "string", "label": "Police", "default": "Inter"}, {"id": "dur", "type": "number", "label": "Durée (s, remplie automatiquement)", "default": 0, "min": 0, "max": 10}]'>
      <div class="hk">
        <i class="pl p1"></i><i class="pl p2"></i><i class="pl p3"></i>
        <div class="hk-box"><div class="hk-t"></div><div class="hk-s" data-var-text="sub"></div></div>
      </div>
      <style>
        #accroche-papier { position: absolute; inset: 0; font-family: var(--font, "Inter"), "Inter", sans-serif; }
        #accroche-papier .hk { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
        #accroche-papier .hk-box { position: absolute; left: 7vmin; right: 7vmin; top: 50%; transform: translateY(-50%); text-align: center; z-index: 5; }
        #accroche-papier .hk-t { font-weight: 900; line-height: 1.02; letter-spacing: -0.02em; }
        #accroche-papier .hk-t .wd { display: inline-block; white-space: nowrap; }
        #accroche-papier .hk-t .ch { display: inline-block; }
        #accroche-papier .hk-s { margin-top: 3vmin; font-size: 4.4vmin; font-weight: 600; opacity: 0; }
        #accroche-papier .pl { position: absolute; left: -20%; width: 140%; height: 60%; border-radius: 50% 50% 0 0 / 22% 22% 0 0; box-shadow: 0 -1.2vmin 2.4vmin rgba(0,0,0,.18); }
        #accroche-papier .p1 { bottom: -18%; background: var(--accent); }
        #accroche-papier .p2 { bottom: -30%; background: color-mix(in srgb, var(--accent) 55%, var(--bg)); left: -40%; }
        #accroche-papier .p3 { bottom: -42%; background: color-mix(in srgb, var(--accent) 30%, var(--ink)); left: -5%; }
        #accroche-papier .hk-t .ch { text-shadow: 0.5vmin 0.6vmin 0 rgba(0,0,0,.22); }
      </style>
      <script>
        (function () {
        function V(id) {
          var out = {}, root = document.getElementById(id);
          try { JSON.parse(root.getAttribute("data-composition-variables")).forEach(function (d) { out[d.id] = d.default; }); } catch (e) {}
          var hf = window.__hyperframes;
          var o = hf && typeof hf.getVariables === "function" ? hf.getVariables() : window.__hfVariables;
          if (o && typeof o === "object") { for (var k in o) { if (o[k] !== undefined) out[k] = o[k]; } }
          return out;
        }
        const v = V("accroche-papier");
        const r = '[data-composition-id="accroche-papier"] ';
        const tl = gsap.timeline({ paused: true });
        const D = Number(v.dur) > 0 ? Number(v.dur) : 3.0;
        const T = String(v.text || ""), host = document.querySelector(r + ".hk-t");
        T.split(" ").forEach(function (w, wi) {
          const ws = document.createElement("span"); ws.className = "wd";
          Array.from(w).forEach(function (c) { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; ws.appendChild(s); });
          host.appendChild(ws); if (wi < T.split(" ").length - 1) host.appendChild(document.createTextNode(" "));
        });
        host.style.fontSize = Math.max(8.5, Math.min(15, 150 / Math.max(6, T.length * 0.95))) + "vmin";
        const CH = document.querySelectorAll(r + ".ch");
        const EXIT = Math.max(1.2, D - 0.45);
        tl.fromTo(r + ".pl", { y: "60%" }, { y: "0%", duration: 0.8, stagger: 0.12, ease: "back.out(1.4)" }, 0);
        CH.forEach(function (c, i) {
          tl.fromTo(c, { opacity: 0, y: -60, rotation: (i % 2 ? 14 : -12) }, { opacity: 1, y: 0, rotation: (i % 3 - 1) * 3, duration: 0.45, ease: "back.out(2.2)" }, 0.25 + i * 0.035);
        });
        tl.fromTo(r + ".hk-s", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, Math.min(1.2, D * 0.4));
        tl.fromTo(r + ".hk", { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 100% 0%)", duration: 0.42, ease: "power3.in" }, EXIT);
        window.__timelines = window.__timelines || {};
        window.__timelines["accroche-papier"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
