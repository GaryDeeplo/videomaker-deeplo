<!-- deeplo-library-block: accroche-pate · pâte à modeler : formes molles qui rebondissent, lettres épaisses qui s'écrasent en tombant -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="accroche-pate" data-composition-id="accroche-pate" data-start="0" data-duration="3.0" data-width="1080" data-height="1920"
      data-composition-variables='[{"id": "text", "type": "string", "label": "Titre (2 à 6 mots)", "default": "Votre titre ici"}, {"id": "sub", "type": "string", "label": "Petite ligne", "default": ""}, {"id": "accent", "type": "color", "label": "Accent", "default": "#ff7a59"}, {"id": "bg", "type": "color", "label": "Fond", "default": "#ffe9c7"}, {"id": "ink", "type": "color", "label": "Encre", "default": "#3b2a6e"}, {"id": "font", "type": "string", "label": "Police", "default": "Inter"}, {"id": "dur", "type": "number", "label": "Durée (s, remplie automatiquement)", "default": 0, "min": 0, "max": 10}]'>
      <div class="hk">
        <i class="bl b1"></i><i class="bl b2"></i><i class="bl b3"></i>
        <div class="hk-box"><div class="hk-t"></div><div class="hk-s" data-var-text="sub"></div></div>
      </div>
      <style>
        #accroche-pate { position: absolute; inset: 0; font-family: var(--font, "Inter"), "Inter", sans-serif; }
        #accroche-pate .hk { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
        #accroche-pate .hk-box { position: absolute; left: 7vmin; right: 7vmin; top: 50%; transform: translateY(-50%); text-align: center; z-index: 5; }
        #accroche-pate .hk-t { font-weight: 900; line-height: 1.02; letter-spacing: -0.02em; }
        #accroche-pate .hk-t .wd { display: inline-block; white-space: nowrap; }
        #accroche-pate .hk-t .ch { display: inline-block; }
        #accroche-pate .hk-s { margin-top: 3vmin; font-size: 4.4vmin; font-weight: 600; opacity: 0; }
        #accroche-pate .bl { position: absolute; border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; box-shadow: inset -2vmin -2.5vmin 0 rgba(0,0,0,.12), inset 1.5vmin 1.5vmin 0 rgba(255,255,255,.35); }
        #accroche-pate .b1 { width: 40vmin; height: 34vmin; left: -8vmin; top: 12%; background: var(--accent); }
        #accroche-pate .b2 { width: 30vmin; height: 30vmin; right: -6vmin; top: 22%; background: #7bd389; }
        #accroche-pate .b3 { width: 48vmin; height: 36vmin; left: 22%; bottom: 6%; background: #8ec5ff; }
        #accroche-pate .hk-t { color: var(--ink); text-shadow: 0 0.9vmin 0 color-mix(in srgb, var(--ink) 60%, #000), 0 1.6vmin 2vmin rgba(0,0,0,.18); }
        #accroche-pate .hk-t .ch { transform-origin: 50% 100%; }
      </style>
      <script>
        (function () {
        function V(id) {
          var out = {}, root = document.getElementById(id);
          try { JSON.parse(root.getAttribute("data-composition-variables")).forEach(function (d) { out[d.id] = d.default; }); } catch (e) {}
          var hf = window.__hyperframes;
          var o = hf && typeof hf.getVariables === "function" ? hf.getVariables() : window.__hfVariables;
          if (o && typeof o === "object") { for (var k in o) { if (o[k] !== undefined) out[k] = o[k]; } }
          return out;
        }
        const v = V("accroche-pate");
        const r = '[data-composition-id="accroche-pate"] ';
        const tl = gsap.timeline({ paused: true });
        const D = Number(v.dur) > 0 ? Number(v.dur) : 3.0;
        const T = String(v.text || ""), host = document.querySelector(r + ".hk-t");
        T.split(" ").forEach(function (w, wi) {
          const ws = document.createElement("span"); ws.className = "wd";
          Array.from(w).forEach(function (c) { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; ws.appendChild(s); });
          host.appendChild(ws); if (wi < T.split(" ").length - 1) host.appendChild(document.createTextNode(" "));
        });
        host.style.fontSize = Math.max(8.5, Math.min(15, 150 / Math.max(6, T.length * 0.95))) + "vmin";
        const CH = document.querySelectorAll(r + ".ch");
        const EXIT = Math.max(1.2, D - 0.45);
        tl.fromTo(r + ".bl", { scale: 0 }, { scale: 1, duration: 0.7, stagger: 0.1, ease: "elastic.out(1, 0.5)" }, 0);
        tl.to(r + ".bl", { borderRadius: "58% 42% 37% 63% / 59% 56% 44% 41%", duration: 1.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, 0.6);
        CH.forEach(function (c, i) {
          const t = 0.3 + i * 0.04;
          tl.fromTo(c, { y: -120, scaleY: 1.3, scaleX: 0.8, opacity: 0 }, { y: 0, scaleY: 1, scaleX: 1, opacity: 1, duration: 0.35, ease: "power2.in" }, t);
          tl.to(c, { scaleY: 0.72, scaleX: 1.2, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.out" }, t + 0.35);
        });
        tl.fromTo(r + ".hk-s", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, Math.min(1.2, D * 0.4));
        tl.fromTo(r + ".hk", { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 100% 0%)", duration: 0.42, ease: "power3.in" }, EXIT);
        window.__timelines = window.__timelines || {};
        window.__timelines["accroche-pate"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
