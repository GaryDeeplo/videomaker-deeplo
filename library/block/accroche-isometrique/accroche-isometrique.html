<!-- deeplo-library-block: accroche-isometrique · isométrique : blocs en perspective qui montent comme des immeubles, titre posé au-dessus -->
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  </head>
  <body>
    <div id="accroche-isometrique" data-composition-id="accroche-isometrique" data-start="0" data-duration="3.0" data-width="1080" data-height="1920"
      data-composition-variables='[{"id": "text", "type": "string", "label": "Titre (2 à 6 mots)", "default": "Votre titre ici"}, {"id": "sub", "type": "string", "label": "Petite ligne", "default": ""}, {"id": "accent", "type": "color", "label": "Accent", "default": "#4361ee"}, {"id": "bg", "type": "color", "label": "Fond", "default": "#eef1f8"}, {"id": "ink", "type": "color", "label": "Encre", "default": "#14213d"}, {"id": "font", "type": "string", "label": "Police", "default": "Inter"}, {"id": "art", "type": "string", "label": "Dessin du sujet (SVG, facultatif)", "default": ""}, {"id": "dur", "type": "number", "label": "Durée (s, remplie automatiquement)", "default": 0, "min": 0, "max": 10}]'>
      <div class="hk">
        <div class="iso"><i class="pr q0"><b></b></i><i class="pr q1"><b></b></i><i class="pr q2"><b></b></i><i class="pr q3"><b></b></i><i class="pr q4"><b></b></i><i class="pr q5"><b></b></i></div>
        <div class="hk-art"></div>
        <div class="hk-box"><div class="hk-t"></div><div class="hk-s" data-var-text="sub"></div></div>
      </div>
      <style>
        #accroche-isometrique { position: absolute; inset: 0; font-family: var(--font, "Inter"), "Inter", sans-serif; }
        #accroche-isometrique .hk { position: absolute; inset: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
        #accroche-isometrique .hk-box { position: absolute; left: 7vmin; right: 7vmin; top: 50%; transform: translateY(-50%); text-align: center; z-index: 5; }
        #accroche-isometrique .hk-t { font-weight: 900; line-height: 1.02; letter-spacing: -0.02em; }
        #accroche-isometrique .hk-t .wd { display: inline-block; white-space: nowrap; }
        #accroche-isometrique .hk-t .ch { display: inline-block; }
        #accroche-isometrique .hk-s { margin-top: 3vmin; font-size: 4.4vmin; font-weight: 600; opacity: 0; overflow-wrap: anywhere; }
        #accroche-isometrique .hk-art { position: absolute; left: 12%; right: 12%; top: 40%; height: 44%; z-index: 4; display: none; }
        #accroche-isometrique .hk-art svg { width: 100%; height: 100%; overflow: visible; }
        #accroche-isometrique .hk-art svg > * { transform-box: fill-box; transform-origin: 50% 50%; }
        #accroche-isometrique .hk.has-art .hk-box { top: 22%; }
        #accroche-isometrique .iso { position: absolute; left: 50%; top: 66%; width: 0; height: 0; }
        #accroche-isometrique .pr { position: absolute; width: 14vmin; bottom: 0; height: 30vmin; transform-origin: 50% 100%;
              background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 80%, #000) 0 50%, var(--accent) 50% 100%); }
        #accroche-isometrique .pr b { position: absolute; left: 0; top: -4vmin; width: 14vmin; height: 8vmin; background: color-mix(in srgb, var(--accent) 45%, #fff);
                clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
        #accroche-isometrique .q0 { left: -40vmin; height: 18vmin; } #accroche-isometrique .q1 { left: -26vmin; height: 30vmin; } #accroche-isometrique .q2 { left: -12vmin; height: 42vmin; }
        #accroche-isometrique .q3 { left: 2vmin; height: 26vmin; } #accroche-isometrique .q4 { left: 16vmin; height: 36vmin; } #accroche-isometrique .q5 { left: 30vmin; height: 20vmin; }
        #accroche-isometrique .hk-box { top: 24%; }
        #accroche-isometrique .hk-t { color: var(--ink); }
      </style>
      <script>
        (function () {
        function V(id) {
          var out = {}, root = document.getElementById(id);
          try { JSON.parse(root.getAttribute("data-composition-variables")).forEach(function (d) { out[d.id] = d.default; }); } catch (e) {}
          var hf = window.__hyperframes;
          var o = hf && typeof hf.getVariables === "function" ? hf.getVariables() : window.__hfVariables;
          if (o && typeof o === "object") { for (var k in o) { if (o[k] !== undefined) out[k] = o[k]; } }
          return out;
        }
        const v = V("accroche-isometrique");
        const r = '[data-composition-id="accroche-isometrique"] ';
        const tl = gsap.timeline({ paused: true });
        const D = Number(v.dur) > 0 ? Number(v.dur) : 3.0;
        const T = String(v.text || ""), host = document.querySelector(r + ".hk-t");
        T.split(" ").forEach(function (w, wi) {
          const ws = document.createElement("span"); ws.className = "wd";
          Array.from(w).forEach(function (c) { const s = document.createElement("span"); s.className = "ch"; s.textContent = c; ws.appendChild(s); });
          host.appendChild(ws); if (wi < T.split(" ").length - 1) host.appendChild(document.createTextNode(" "));
        });
        const LW = Math.max.apply(null, T.split(" ").map(function (w) { return w.length; }).concat([1]));  // le mot le plus long tient dans la largeur
        host.style.fontSize = Math.max(5, Math.min(15, 150 / Math.max(6, T.length * 0.95), 82 / (0.74 * LW))) + "vmin";
        const CH = document.querySelectorAll(r + ".ch");
        const EXIT = Math.max(1.2, D - 0.45);
        // dessin du sujet (variable "art" : SVG écrit par Claude dans le style) : la mise en page lui fait de la place
        const ART = document.querySelector(r + ".hk-art");
        let PIECES = [], STROKES = [];
        if (v.art) {
          ART.innerHTML = String(v.art); ART.style.display = "block"; document.querySelector(r + ".hk").classList.add("has-art");
          const sv = ART.querySelector("svg"); if (sv) { sv.removeAttribute("width"); sv.removeAttribute("height"); }
          PIECES = Array.from(ART.querySelectorAll("svg > *"));
          STROKES = Array.from(ART.querySelectorAll("path, line, polyline, polygon, circle, ellipse, rect"));
          STROKES.forEach(function (e) { try { const L = e.getTotalLength(); e.style.strokeDasharray = L; e.dataset.l = L; } catch (x) {} });
        }
        tl.fromTo(r + ".pr", { scaleY: 0 }, { scaleY: 1, duration: 0.6, stagger: 0.08, ease: "back.out(1.6)" }, 0.1);
        tl.fromTo(CH, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, stagger: 0.03, ease: "power3.out" }, 0.5);
        if (PIECES.length) {
          tl.fromTo(PIECES, { opacity: 0, y: 70 }, { opacity: 1, y: 0, duration: 0.55, stagger: 0.07, ease: "back.out(1.6)" }, 0.3);
        }
        tl.fromTo(r + ".hk-s", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, Math.min(1.2, D * 0.4));
        tl.fromTo(r + ".hk", { clipPath: "inset(0% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 100% 0%)", duration: 0.42, ease: "power3.in" }, EXIT);
        window.__timelines = window.__timelines || {};
        window.__timelines["accroche-isometrique"] = tl;
        })();
      </script>
    </div>
  </body>
</html>
